name: Illustration Request
description: Suggest a new illustration for the collection.
labels: ["illustration-request"]
body:
  - type: textarea
    id: subject
    attributes:
      label: What should the illustration show?
      description: Be as specific as you like -- subject, object, concept, scene.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and intended use
      description: Where would you use this? Any preferred accent color or style notes?
    validations:
      required: false
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Before submitting
      options:
        - label: I understand that all illustrations are generated by the maintainer and requests are not guaranteed to be fulfilled.
          required: true
